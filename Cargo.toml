[package]
name = "dawn_of_civilization"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug = false

[features]
default = ["dev"]
dev = ["bevy/dynamic_linking"]
